server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user_service_route
          uri: http://localhost:8081
          predicates:
            - Path=/users/**
        - id: order_service_route
          uri: http://localhost:8082
          predicates:
            - Path=/orders/**

logging:
  level:
    com.cognizant.gateway: DEBUG
